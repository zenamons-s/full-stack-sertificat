name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: certificates
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d certificates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: pgsql://app:change_me@127.0.0.1:5432/certificates_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: change_me_local_jwt_secret_32_chars
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "1209600"
      CACHE_TTL: "60"
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl
          ini-values: memory_limit=512M
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create test database
        run: php -r '$pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres", "app", "change_me"); $pdo->exec("CREATE DATABASE certificates_test");'

      - name: Run migrations
        run: php bin/console migrate --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-dev

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: worker/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: worker

      - name: Run Go tests with race detector
        run: go test ./... -race

  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Generate OpenAPI types
        run: npm run generate:api

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      - name: Run Vitest
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare local env file
        run: cp .env.example .env

      - name: Build Docker images
        run: docker compose build
