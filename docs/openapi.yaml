openapi: 3.1.0
info:
  title: Gift Certificates API
  version: 0.1.0
  description: Контракт API платформы подарочных сертификатов.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Базовый путь API.
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Аутентификация и текущий пользователь.
  - name: Certificates
    description: Управление подарочными сертификатами.
  - name: System
    description: Служебные эндпоинты.
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Вход
      description: Возвращает пару JWT-токенов по email и паролю.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                summary: Данные входа
                value:
                  email: admin@example.com
                  password: Password123!
      responses:
        "200":
          description: Успешный вход.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPair"
              examples:
                success:
                  $ref: "#/components/examples/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Обновление токенов
      description: Обменивает refresh-токен на новую пару токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              default:
                summary: Refresh-токен
                value:
                  refresh_token: refresh.jwt.token
      responses:
        "200":
          description: Токены обновлены.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenPair"
              examples:
                success:
                  $ref: "#/components/examples/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Текущий пользователь
      description: Возвращает пользователя из access-токена.
      responses:
        "200":
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                success:
                  value:
                    id: 1
                    email: admin@example.com
                    created_at: "2026-12-31T23:59:59Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /certificates:
    get:
      operationId: listCertificates
      tags: [Certificates]
      summary: Список сертификатов
      description: Возвращает страницу сертификатов с фильтрами и сортировкой.
      parameters:
        - name: search
          in: query
          required: false
          description: Поиск по названию.
          schema:
            type: string
            minLength: 1
          example: spa
        - name: status
          in: query
          required: false
          description: Фильтр по хранимому статусу.
          schema:
            $ref: "#/components/schemas/CertificateStatus"
          example: active
        - name: trashed
          in: query
          required: false
          description: Видимость мягко удалённых записей.
          schema:
            type: string
            enum: [none, with, only]
            default: none
          example: none
        - name: page
          in: query
          required: false
          description: Номер страницы.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Размер страницы.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: sort
          in: query
          required: false
          description: Поле сортировки; минус означает убывание.
          schema:
            type: string
            enum:
              - created_at
              - -created_at
              - expires_at
              - -expires_at
              - price_minor
              - -price_minor
              - title
              - -title
            default: -created_at
          example: -created_at
      responses:
        "200":
          description: Страница сертификатов.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCertificates"
              examples:
                success:
                  $ref: "#/components/examples/PaginatedCertificates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createCertificate
      tags: [Certificates]
      summary: Создание сертификата
      description: Создаёт активный сертификат.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateRequest"
            examples:
              default:
                value:
                  title: SPA на двоих
                  price_minor: 500000
                  currency: RUB
                  expires_at: "2026-12-31T23:59:59Z"
      responses:
        "201":
          description: Сертификат создан.
          headers:
            Location:
              description: URL созданного сертификата.
              schema:
                type: string
              example: /api/v1/certificates/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
              examples:
                success:
                  $ref: "#/components/examples/CertificateActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /certificates/{id}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      operationId: getCertificate
      tags: [Certificates]
      summary: Сертификат
      description: Возвращает сертификат по идентификатору.
      responses:
        "200":
          description: Сертификат найден.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
              examples:
                success:
                  $ref: "#/components/examples/CertificateActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCertificate
      tags: [Certificates]
      summary: Обновление сертификата
      description: Частично обновляет сертификат с проверкой версии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCertificateRequest"
            examples:
              default:
                value:
                  title: SPA на двоих
                  price_minor: 600000
                  currency: RUB
                  expires_at: "2026-12-31T23:59:59Z"
                  version: 1
      responses:
        "200":
          description: Сертификат обновлён.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
              examples:
                success:
                  $ref: "#/components/examples/CertificateUpdated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteCertificate
      tags: [Certificates]
      summary: Удаление сертификата
      description: Мягко удаляет сертификат.
      responses:
        "204":
          description: Сертификат удалён.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /certificates/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      operationId: restoreCertificate
      tags: [Certificates]
      summary: Восстановление сертификата
      description: Возвращает мягко удалённый сертификат в список.
      responses:
        "200":
          description: Сертификат восстановлен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
              examples:
                success:
                  $ref: "#/components/examples/CertificateActive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /certificates/{id}/audit:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
      - name: page
        in: query
        required: false
        description: Номер страницы.
        schema:
          type: integer
          minimum: 1
          default: 1
        example: 1
      - name: per_page
        in: query
        required: false
        description: Размер страницы.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        example: 20
    get:
      operationId: listCertificateAudit
      tags: [Certificates]
      summary: Аудит сертификата
      description: Возвращает историю изменений сертификата.
      responses:
        "200":
          description: Страница записей аудита.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditRecords"
              examples:
                success:
                  $ref: "#/components/examples/PaginatedAuditRecords"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Проверка здоровья
      description: Показывает состояние API и зависимостей. Недоступность Redis не даёт 503, а отражается полем redis=degraded, так как кеш не является обязательной зависимостью.
      security: []
      responses:
        "200":
          description: Сервис и база данных доступны.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                success:
                  value:
                    status: ok
                    db: ok
                    redis: ok
                    version: 0.1.0
        "503":
          description: База данных недоступна.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                databaseUnavailable:
                  value:
                    status: degraded
                    db: error
                    redis: ok
                    version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access-токен.
  parameters:
    CertificateId:
      name: id
      in: path
      required: true
      description: Идентификатор сертификата.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  responses:
    Unauthorized:
      description: Нет действительного токена.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            missingToken:
              $ref: "#/components/examples/UnauthorizedProblem"
    NotFound:
      description: Ресурс не найден.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              $ref: "#/components/examples/NotFoundProblem"
    Conflict:
      description: Конфликт версии или состояния.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            versionConflict:
              $ref: "#/components/examples/ConflictProblem"
    ValidationError:
      description: Ошибка валидации.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validation:
              $ref: "#/components/examples/ValidationProblem"
    RateLimited:
      description: Слишком много попыток.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            rateLimited:
              $ref: "#/components/examples/RateLimitProblem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email пользователя.
          examples: [admin@example.com]
        password:
          type: string
          minLength: 1
          description: Пароль пользователя.
          examples: [Password123!]
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Refresh-токен.
          examples: [refresh.jwt.token]
    AuthTokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Access JWT.
          examples: [access.jwt.token]
        refresh_token:
          type: string
          description: Refresh JWT.
          examples: [refresh.jwt.token]
        token_type:
          type: string
          enum: [Bearer]
          description: Тип токена.
          examples: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: TTL access-токена в секундах.
          examples: [900]
    User:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор пользователя.
          examples: [1]
        email:
          type: string
          format: email
          description: Email пользователя.
          examples: [admin@example.com]
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата создания в UTC.
          examples: ["2026-12-31T23:59:59Z"]
    CertificateStatus:
      type: string
      enum: [active, expired, redeemed, cancelled]
      description: Хранимый статус сертификата.
    Certificate:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - price_minor
        - currency
        - price_formatted
        - expires_at
        - status
        - version
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор сертификата.
          examples: [1]
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Название сертификата.
          examples: [SPA на двоих]
        price_minor:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: Цена в минорных единицах.
          examples: [500000]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: ISO-код валюты.
          examples: [RUB]
        price_formatted:
          type: string
          readOnly: true
          description: Отформатированная цена.
          examples: ["5 000,00 ₽"]
        expires_at:
          type: string
          format: date-time
          description: Дата истечения в UTC.
          examples: ["2026-12-31T23:59:59Z"]
        status:
          allOf:
            - $ref: "#/components/schemas/CertificateStatus"
          readOnly: true
        version:
          type: integer
          minimum: 1
          description: Версия для оптимистичной блокировки.
          examples: [1]
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата создания в UTC.
          examples: ["2026-12-31T23:59:59Z"]
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Дата обновления в UTC.
          examples: ["2026-12-31T23:59:59Z"]
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          description: Дата мягкого удаления в UTC.
          examples: [null]
    CreateCertificateRequest:
      type: object
      additionalProperties: false
      required: [title, price_minor, expires_at]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Название сертификата.
          examples: [SPA на двоих]
        price_minor:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: Цена в минорных единицах.
          examples: [500000]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          default: RUB
          description: ISO-код валюты.
          examples: [RUB]
        expires_at:
          type: string
          format: date-time
          description: Дата истечения в UTC.
          examples: ["2026-12-31T23:59:59Z"]
    UpdateCertificateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Новое название сертификата.
          examples: [SPA на двоих]
        price_minor:
          type: integer
          format: int64
          exclusiveMinimum: 0
          description: Новая цена в минорных единицах.
          examples: [600000]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
          description: Новый ISO-код валюты.
          examples: [RUB]
        expires_at:
          type: string
          format: date-time
          description: Новая дата истечения в UTC.
          examples: ["2026-12-31T23:59:59Z"]
        version:
          type: integer
          minimum: 1
          description: Текущая версия записи.
          examples: [1]
    PaginatedCertificates:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          description: Сертификаты текущей страницы.
          items:
            $ref: "#/components/schemas/Certificate"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Номер страницы.
          examples: [1]
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          description: Размер страницы.
          examples: [20]
        total:
          type: integer
          minimum: 0
          description: Всего записей.
          examples: [137]
        total_pages:
          type: integer
          minimum: 0
          description: Всего страниц.
          examples: [7]
    AuditRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - certificate_id
        - actor_type
        - actor_id
        - action
        - changes
        - request_id
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: Идентификатор записи аудита.
          examples: [10]
        certificate_id:
          type: integer
          format: int64
          description: Идентификатор сертификата.
          examples: [1]
        actor_type:
          type: string
          enum: [user, worker, system]
          description: Тип автора изменения.
          examples: [user]
        actor_id:
          type:
            - integer
            - "null"
          format: int64
          description: Идентификатор автора, если есть.
          examples: [1]
        action:
          type: string
          enum: [created, updated, deleted, restored, renewed, expired]
          description: Выполненное действие.
          examples: [updated]
        changes:
          type: object
          description: Изменения полей в формате field -> old/new.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [old, new]
            properties:
              old:
                description: Старое значение.
              new:
                description: Новое значение.
          examples:
            - price_minor:
                old: 500000
                new: 600000
              expires_at:
                old: "2026-12-31T23:59:59Z"
                new: "2026-12-31T23:59:59Z"
        request_id:
          type:
            - string
            - "null"
          description: Идентификатор запроса.
          examples: [01J9REQUESTID]
        created_at:
          type: string
          format: date-time
          description: Дата записи аудита в UTC.
          examples: ["2026-12-31T23:59:59Z"]
    PaginatedAuditRecords:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          description: Записи аудита текущей страницы.
          items:
            $ref: "#/components/schemas/AuditRecord"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, db, redis, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Общее состояние API.
          examples: [ok]
        db:
          type: string
          enum: [ok, error]
          description: Состояние PostgreSQL.
          examples: [ok]
        redis:
          type: string
          enum: [ok, degraded]
          description: Состояние Redis.
          examples: [ok]
        version:
          type: string
          description: Версия приложения.
          examples: [0.1.0]
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, request_id]
      properties:
        type:
          type: string
          format: uri
          description: URI типа ошибки.
          examples: [https://api.local/problems/validation-error]
        title:
          type: string
          description: Краткое название ошибки.
          examples: [Validation failed]
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-статус.
          examples: [422]
        detail:
          type: string
          description: Подробность ошибки.
          examples: [Request payload is invalid]
        instance:
          type: string
          description: Путь запроса.
          examples: [/api/v1/certificates]
        request_id:
          type: string
          description: Идентификатор запроса.
          examples: [01J9REQUESTID]
        errors:
          type: object
          description: Ошибки полей, только для 422.
          additionalProperties:
            type: array
            items:
              type: string
        current_state:
          allOf:
            - $ref: "#/components/schemas/Certificate"
          description: Актуальное состояние записи, только для 409.
  examples:
    AuthTokens:
      value:
        access_token: access.jwt.token
        refresh_token: refresh.jwt.token
        token_type: Bearer
        expires_in: 900
    CertificateActive:
      value:
        id: 1
        title: SPA на двоих
        price_minor: 500000
        currency: RUB
        price_formatted: "5 000,00 ₽"
        expires_at: "2026-12-31T23:59:59Z"
        status: active
        version: 1
        created_at: "2026-12-31T23:59:59Z"
        updated_at: "2026-12-31T23:59:59Z"
        deleted_at: null
    CertificateUpdated:
      value:
        id: 1
        title: SPA на двоих
