services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  migrator:
    build:
      context: ./backend
      target: runtime
    env_file:
      - .env
    command: ["sh", "-lc", "php bin/console migrate --no-interaction && php bin/console seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_FILENAME=/var/www/html/public/index.php SCRIPT_NAME=/index.php REQUEST_METHOD=GET REQUEST_URI=/health cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q '\"db\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  backend-dev:
    profiles:
      - dev
    build:
      context: ./backend
      target: devtools
    env_file:
      - .env
    working_dir: /app
    command: ["vendor/bin/phpstan", "analyse", "--no-progress"]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: ./worker
      target: runtime
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: runtime
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
